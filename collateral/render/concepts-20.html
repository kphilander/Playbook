<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playbook — Three editorial concepts</title>
  <link rel="stylesheet" href="brand-inject.css">
  <link rel="stylesheet" href="concept-20.css">
  <style>
    body { background: var(--pb-color-neutral-50); color: var(--pb-color-primary); font-family: var(--pb-font-body); }
    .review-sheet { max-width: 1600px; margin: auto; padding: 54px 58px 44px; }
    .review-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--pb-color-primary); padding-bottom: 24px; margin-bottom: 32px; }
    .review-header h1 { margin: 0; font: 700 38px/1.1 var(--pb-font-heading); letter-spacing: -0.035em; }
    .review-header p { margin: 0; font-size: 24px; }
    .concept-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
    .review-concept { margin: 0; min-width: 0; }
    .review-concept img { display: block; width: 100%; height: auto; }
    .review-concept h2 { font: 700 25px/1.2 var(--pb-font-heading); margin: 22px 0 8px; letter-spacing: -0.025em; }
    .review-concept p { font-size: 23px; line-height: 1.35; margin: 0; }
    .review-concept a { color: var(--pb-color-secondary-dark); }
    .review-note { border-top: 1px solid var(--pb-color-neutral-300); margin-top: 30px; padding-top: 20px; display: flex; justify-content: space-between; gap: 24px; font-size: 22px; }
    .review-note a { color: var(--pb-color-secondary-dark); }
    @media (max-width: 800px) { .review-sheet { padding: 24px; } .concept-grid { grid-template-columns: 1fr; } .review-header, .review-note { flex-direction: column; gap: 16px; } }
  </style>
</head>
<body>
  <main class="review-sheet">
    <header class="review-header"><h1>Playbook / Three editorial concepts</h1><p>Series 20 · Tier 1 · Social</p></header>
    <section class="concept-grid" aria-label="Three concept previews">
      <figure class="review-concept">
        <a href="card-20a-return-vs-profit.png"><img src="card-20a-return-vs-profit.png" alt="Your return isn’t your profit. An example receipt shows $50 returned minus $20 staked equals $30 profit."></a>
        <figcaption><h2>01 / Bet slip decoded</h2><p>A receipt makes return versus profit<br>impossible to miss. <a href="card-20a-return-vs-profit.html">HTML master ↗</a></p></figcaption>
      </figure>
      <figure class="review-concept">
        <a href="card-20b-pick-your-pause.png"><img src="card-20b-pick-your-pause.png" alt="Even a good night has an end time. An emerald clock card encourages choosing when to stop and setting a reminder."></a>
        <figcaption><h2>02 / Pick your pause</h2><p>A bold clock makes an end time<br>part of the plan. <a href="card-20b-pick-your-pause.html">HTML master ↗</a></p></figcaption>
      </figure>
      <figure class="review-concept">
        <a href="card-20c-parlay-probability.png"><img src="card-20c-parlay-probability.png" alt="More picks. Smaller target. A grid illustrates a 1-in-16 chance that four independent picks with true 50/50 chances all win."></a>
        <figcaption><h2>03 / Parlay, unpacked</h2><p>Sixteen possible outcomes.<br>One all-win result. <a href="card-20c-parlay-probability.html">HTML master ↗</a></p></figcaption>
      </figure>
    </section>
    <footer class="review-note"><span>1080 × 1350 masters · Editable HTML + PNG</span><a href="concepts-20.md">Captions, alt text &amp; source notes ↗</a></footer>
  </main>
</body>
</html>
