<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Noto+Sans+SC:wght@300;400;600;700;800;900&family=Source+Code+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; background: transparent; }
  .social-card {
    width: 1080px; height: 1080px;
    background: var(--pb-color-primary);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .social-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, var(--pb-color-accent), var(--pb-color-secondary)); }
  .card-header { padding: 56px 64px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .card-logo { font-family: var(--pb-font-heading); font-size: calc(32px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); font-weight: 700; letter-spacing: -0.018em; }

  .section-label { font-family: var(--pb-font-heading); font-size: calc(18px * var(--pb-template-text-scale, 1)); font-weight: 700; color: var(--pb-color-accent); }
  .card-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 64px; position: relative; z-index: 1; }
  .headline { font-family: var(--pb-font-heading); font-size: calc(56px * var(--pb-template-text-scale, 1)); font-weight: 700; line-height: 1.3; color: var(--pb-surface-ink, var(--pb-color-white)); margin-bottom: 40px; }
  .breakdown { margin-bottom: 36px; }
  .breakdown-line { font-family: var(--pb-font-body); font-size: calc(30px * var(--pb-template-text-scale, 1)); font-weight: 600; color: var(--pb-surface-ink, var(--pb-color-white)); line-height: 2; }
  .breakdown-line .amount { font-family: var(--pb-font-mono); color: var(--pb-color-secondary); font-weight: 700; }
  .breakdown-line .cut { font-family: var(--pb-font-mono); color: var(--pb-color-accent); font-weight: 700; }
  .explanation { font-family: var(--pb-font-body); font-size: calc(28px * var(--pb-template-text-scale, 1)); line-height: 1.7; color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); margin-bottom: 24px; }
  .emphasis { font-family: var(--pb-font-heading); font-size: calc(24px * var(--pb-template-text-scale, 1)); font-weight: 700; color: var(--pb-color-accent); }
  .vig-strip { margin-top: 32px; display: flex; gap: 16px; }
  .vig-card { flex: 1; background: color-mix(in srgb, var(--pb-surface-ink, #fff) 4%, transparent); border: 1px solid color-mix(in srgb, var(--pb-surface-ink, #fff) 8%, transparent); border-radius: 12px; padding: 20px; text-align: center; }
  .vig-label { font-family: var(--pb-font-body); font-size: calc(17px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); margin-bottom: 8px; }
  .vig-value { font-family: 'Inter', system-ui, sans-serif; font-size: calc(30px * var(--pb-template-text-scale, 1)); font-weight: 800; color: var(--pb-surface-ink, var(--pb-color-white)); }
  .vig-note { font-family: var(--pb-font-body); font-size: calc(15px * var(--pb-template-text-scale, 1)); color: var(--pb-color-neutral-500); margin-top: 4px; line-height: 1.5; }
  .card-footer { background: var(--pb-color-primary-light); padding: 20px 64px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .footer-helpline { font-family: var(--pb-font-mono); font-weight: 700; font-size: calc(16px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); }
  .footer-legal { font-size: calc(13px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); font-family: var(--pb-font-body); }
</style>
  <link rel="stylesheet" href="brand-inject.css">
  <style>
    /* Locale-specific font cascade override — must come AFTER brand-inject.css to win */
    :root {
      --pb-font-heading: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      --pb-font-body: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
    }
  </style>
  </head>
<body>
<div class="social-card">
  <div class="card-header">
    <span class="card-logo">Playbook</span>
    <span class="section-label">真实赔率</span>
  </div>
  <div class="card-body">
    <div class="headline">−110：抽成只是换了件外套。</div>
    <div class="breakdown">
      <div class="breakdown-line">投注 <span class="amount">澳门币 110</span></div>
      <div class="breakdown-line">赢时净利 <span class="amount">澳门币 100</span></div>
    </div>
    <div class="explanation">价格藏在盘口里。</div>
    <div class="emphasis">若两边均为−110，博彩公司内含的利润率约为4.8%。</div>
  </div>
  <div class="card-footer">
    <span class="footer-helpline">24小时免费保密支援：{{HELPLINE_NUMBER}}</span>
    <span class="footer-legal">{{AGE_DISCLAIMER}}</span>
  </div>
</div>
</body>
</html>
