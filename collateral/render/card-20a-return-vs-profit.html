<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your return isn't your profit — {{PROGRAM_SHORT_NAME}}</title>
  <!--
  content_type: quick-reference
  pillar: [open, social]
  tier: 1
  tone: confident-informative
  audience: [general, sports-bettors]
  channel: [social-media]
  reading_level: grade-6-8
  Source: how-to-play/sports-betting.md, "Decimal odds".
  Illustrative settled cash bet; total return includes the original stake.
  -->
  <link rel="stylesheet" href="brand-inject.css">
  <link rel="stylesheet" href="concept-20.css">
<link rel="stylesheet" href="creative-system.css">
</head>
<body>
  <article class="social-card concept-20 concept-return pb-creative" data-layout="receipt-proof" aria-labelledby="headline">
    <header class="card-header">
      <span class="card-logo">{{PROGRAM_SHORT_NAME}}</span>
      <span class="series-label">Bet slip decoded</span>
    </header>
    <main class="concept-main">
      <h1 id="headline">Your return<br><em>isn’t your profit.</em></h1>
      <section class="receipt" aria-label="Example: return minus stake equals profit">
        <p class="receipt-caption">One winning cash bet</p>
        <dl>
          <div class="receipt-row"><dt>Total return</dt><dd>$50</dd></div>
          <div class="receipt-row"><dt>Your stake</dt><dd>−$20</dd></div>
          <div class="receipt-row receipt-total"><dt>Your profit</dt><dd>$30</dd></div>
        </dl>
      </section>
      <p class="concept-copy">Your return includes your stake.<br>Subtract it to see your profit.</p>
      <p class="concept-action">Check the full breakdown.
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M8 24h30M25 11l13 13-13 13"/></svg>
      </p>
    </main>
    <footer class="card-footer" data-protected-zone="support-and-legal">
      <span>Free support: {{HELPLINE_NUMBER}}</span>
      <span class="footer-legal">{{AGE_DISCLAIMER}}</span>
    </footer>
  </article>
</body>
</html>
