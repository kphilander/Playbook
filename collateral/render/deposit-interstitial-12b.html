<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=420">
<title>Deposit Interstitial — Limit Setting — Tier 1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin: 0; padding: 0; background: transparent; }

  .deposit-interstitial {
    width: 420px;
    height: 812px;
    background: var(--pb-color-primary);
    color: var(--pb-surface-ink, var(--pb-color-white));
    font-family: var(--pb-font-body);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  /* Accent bar */
  .accent-bar {
    height: 8px;
    background: var(--pb-gradient-bar, linear-gradient(90deg, var(--pb-color-accent), var(--pb-color-secondary)));
    flex-shrink: 0;
  }

  /* Header */
  .header {
    padding: 32px 32px 0;
  }
  .card-logo {
    font-family: var(--pb-font-heading);
    font-size: calc(24px * var(--pb-template-text-scale, 1));
    color: var(--pb-surface-ink, var(--pb-color-white));

    font-weight: 700;
    letter-spacing: -0.018em;
  }

  /* Content */
  .content {
    padding: 40px 32px 0;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .heading {
    font-family: var(--pb-font-heading);
    font-weight: 800;
    font-size: calc(28px * var(--pb-template-text-scale, 1));
    color: var(--pb-surface-ink, var(--pb-color-white));
    line-height: 1.2;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .body-text {
    font-family: var(--pb-font-body);
    font-size: calc(17px * var(--pb-template-text-scale, 1));
    color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300));
    line-height: 1.6;
    margin-bottom: 32px;
  }

  /* Limit options — radio cards */
  .limit-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 36px;
  }
  .limit-option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border: 1.5px solid color-mix(in srgb, var(--pb-surface-ink, #fff) 10%, transparent);
    border-radius: 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .limit-option:hover {
    border-color: color-mix(in srgb, var(--pb-surface-ink, #fff) 25%, transparent);
  }
  .limit-option.selected {
    border-color: var(--pb-color-secondary);
    background: rgba(16,185,129,0.1);
  }
  .radio-circle {
    width: 22px;
    height: 22px;
    min-width: 22px;
    border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--pb-surface-ink, #fff) 30%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .selected .radio-circle {
    border-color: var(--pb-color-secondary);
  }
  .radio-fill {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: transparent;
  }
  .selected .radio-fill {
    background: var(--pb-color-secondary);
  }
  .limit-label {
    font-family: var(--pb-font-heading);
    font-weight: 600;
    font-size: calc(16px * var(--pb-template-text-scale, 1));
    color: var(--pb-surface-ink, var(--pb-color-white));
  }

  /* CTA */
  .cta-button {
    display: block;
    width: 100%;
    padding: 16px;
    background: var(--pb-color-secondary);
    color: var(--pb-brand-ink, var(--pb-color-primary));
    font-family: var(--pb-font-heading);
    font-weight: 700;
    font-size: calc(16px * var(--pb-template-text-scale, 1));
    text-align: center;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.01em;
    margin-top: auto;
    margin-bottom: 16px;
  }

  .skip-link {
    text-align: center;
    font-family: var(--pb-font-heading);
    font-size: calc(16px * var(--pb-template-text-scale, 1));
    font-weight: 600;
    color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300));
    text-decoration: none;
    cursor: pointer;
    display: block;
    padding-bottom: 8px;
  }
  .skip-link:hover {
    color: var(--pb-surface-ink, var(--pb-color-white));
  }

  /* Footer */
  .footer {
    padding: 16px 32px 28px;
    text-align: center;
  }
  .footer-helpline {
    font-family: var(--pb-font-mono);
    font-weight: 600;
    font-size: calc(18px * var(--pb-template-text-scale, 1));
    color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300));
  }
</style>
  <link rel="stylesheet" href="brand-inject.css">
  <link rel="stylesheet" href="creative-system.css">
</head>
<body>
<div class="deposit-interstitial pb-creative">

  <div class="accent-bar"></div>

  <div class="header">
    <span class="card-logo">{{PROGRAM_SHORT_NAME}}</span>
  </div>

  <div class="content">
    <h1 class="heading">Before you deposit</h1>
    <p class="body-text">Choose how much you want to deposit each week. Review the limit before continuing.</p>

    <div class="limit-list">
      <div class="limit-option">
        <div class="radio-circle"><div class="radio-fill"></div></div>
        <div class="limit-label">$50/week</div>
      </div>
      <div class="limit-option selected">
        <div class="radio-circle"><div class="radio-fill"></div></div>
        <div class="limit-label">$100/week</div>
      </div>
      <div class="limit-option">
        <div class="radio-circle"><div class="radio-fill"></div></div>
        <div class="limit-label">$200/week</div>
      </div>
      <div class="limit-option">
        <div class="radio-circle"><div class="radio-fill"></div></div>
        <div class="limit-label">Custom</div>
      </div>
    </div>

    <button class="cta-button">Set limit &amp; continue</button>
    <a class="skip-link">Skip for now</a>
  </div>

  <div class="footer">
    <span class="footer-helpline">24/7 Support: {{HELPLINE_NUMBER}}</span>
  </div>

</div>
</body>
</html>
