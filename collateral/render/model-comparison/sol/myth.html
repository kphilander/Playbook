<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>95% RTP is not 95 winning spins — {{PROGRAM_SHORT_NAME}}</title>
  <!--
  content_type: myth-bust
  pillar: [open, social]
  tier: 1
  tone: playful-witty
  audience: [general]
  channel: [social-media]
  reading_level: grade-6-8
  Source: how-to-play/slots.md, "House edge and RTP" and "Quiz questions — Question 2".
  The 95% figure is an illustrative machine RTP and describes money returned across all play over the long run, not win frequency or one session.
  -->
  <link rel="stylesheet" href="../../brand-inject.css">
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <article class="social-card sol-card myth-card" aria-labelledby="myth-title">
    <header class="card-header">
      <span class="card-logo">{{PROGRAM_SHORT_NAME}}</span>
      <span class="series-label">Myth decoded</span>
    </header>
    <main class="card-main">
      <h1 id="myth-title"><em>95% RTP</em><br>is not 95 winning spins.</h1>
      <p class="lead">RTP tracks money, not how often the reels celebrate.</p>
      <figure class="rtp-proof" aria-label="A 95 percent RTP means 95 units returned for every 100 units wagered across all play over time. It does not mean 95 winning spins out of 100.">
        <div class="proof-row">
          <strong class="proof-number">95%</strong>
          <span class="proof-symbol">=</span>
          <span class="proof-copy">long-run money returned</span>
        </div>
        <div class="proof-row false">
          <strong class="proof-number">95/100</strong>
          <span class="proof-symbol">≠</span>
          <span class="proof-copy">winning spins</span>
        </div>
        <figcaption class="rtp-assumption">Example: 95% RTP across all play, over time. One session can land anywhere.</figcaption>
      </figure>
      <p class="action-line">Check the RTP. Know what it measures.</p>
    </main>
    <footer class="card-footer" data-protected-zone="support-and-legal">
      <span class="footer-support">Free support: {{HELPLINE_NUMBER}}</span>
      <span class="footer-legal">{{AGE_DISCLAIMER}}</span>
    </footer>
  </article>
</body>
</html>
