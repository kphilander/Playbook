<body><article class="social-card astra-card astra-sports" aria-labelledby="headline">

<h1 id="headline">A payout isn’t<br><em>all profit.</em></h1>
<p class="premise">Example: a $10 bet at +150 odds.</p>
<figure class="return-map" aria-label="If the example bet wins, the $25 total return consists of the original $10 stake plus $15 profit.">
<figcaption class="return-total"><strong>$25</strong><span>Total back<br>if your bet wins</span></figcaption>
<svg class="branch" viewBox="0 0 952 54" fill="none" aria-hidden="true"><path d="M476 0v25H232v29M476 25h244v29" stroke="currentColor" stroke-width="4"/></svg>
<div class="pockets"><div class="pocket"><strong>$10</strong><span>Your stake back</span></div><div class="pocket profit"><strong>+$15</strong><span>Your profit</span></div></div>
</figure>
<p class="takeaway">The payout includes the money<br>you put in. If the bet loses, it’s gone.</p>
<p class="action">Separate the stake from the profit.<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M7 24h32M26 11l13 13-13 13"/></svg></p>
