<section class="sheet-row"><h2>Sports betting</h2><div class="sheet-cards"><img src="astra/sports.png" width="1080" height="1350" alt="GPT-6 Astra: Playbook sports math card on navy. Headline: A payout isn’t all profit. Example: a $10 bet at +150 odds. A diagram branches from $25, total back if your bet wins, into $10, your stake back, and +$15, your profit. Text: The payout includes the money you put in. If the bet loses, it’s gone. Action: Separate the stake from the profit. A protected footer displays free support and age information from the brand configuration."><img src="sol/sports.png" width="1080" height="1350" alt="GPT-5.6 Sol: Playbook sports-math card titled Half right. Still down. A navy scoreboard shows ten equal bets at minus 110: five wins produce 500 dollars in profit, five losses cost 550 dollars, leaving a season total of minus 50 dollars. The action line reads Read the line. Price the vig."><img src="terra/sports.png" width="1080" height="1350" alt="GPT-5.6 Terra: A Playbook social card with a three-pick parlay ticket. It says every leg has to land, every pick must win, and three independent picks with a true 50/50 chance each produce a one-in-eight chance that all three win."></div></section>
<section class="sheet-row"><h2>Gambling myth</h2><div class="sheet-cards"><img src="astra/myth.png" width="1080" height="1350" alt="GPT-6 Astra: Playbook myth/fact card on a pale background. Headline: “Almost” isn’t a forecast. A navy panel labeled Illustration: a non-winning spin shows two matching seven symbols and a diamond. A crossed arrow accompanies No preview of the next spin. Text: A near miss doesn’t make the next spin more likely to win. Each spin is independent. Action: Share this next time “almost” lands. A protected navy footer displays free support and age information from the brand configuration."><img src="sol/myth.png" width="1080" height="1350" alt="GPT-5.6 Sol: Bright emerald Playbook myth card titled 95 percent RTP is not 95 winning spins. A white proof panel states that 95 percent equals long-run money returned and does not equal 95 winning spins out of 100. A note says the example applies across all play over time and one session can land anywhere."><img src="terra/myth.png" width="1080" height="1350" alt="GPT-5.6 Terra: A dark Playbook myth card reads The slot does not have a memory. Seven faded past spin markers sit above a bright label stating Next spin: same odds."></div></section>
<section class="sheet-row"><h2>Agent’s choice</h2><div class="sheet-cards"><img src="astra/wildcard.png" width="1080" height="1350" alt="GPT-6 Astra: Playbook bonus decoder card on emerald. Headline: Read the × before the $. The stated example is a 20-times wagering rule that applies to the bonus only. A navy equation panel reads $50 bonus multiplied by 20 multiplier equals $1,000 in qualifying bets required before bonus withdrawal. Text: Check which games count and when the offer expires. Action: Read the terms before opting in. A protected navy footer displays free support and age information from the brand configuration."><img src="sol/wildcard.png" width="1080" height="1350" alt="GPT-5.6 Sol: Orange Playbook pace-check card titled Small bet. Fast clock. A navy calculation board shows 50 cents each spin times 20 spins per minute equals 10 dollars wagered per minute. A second line shows 10 dollars times 60 minutes equals 600 dollars wagered per hour. The action line reads Pick your pace. Set your budget."><img src="terra/wildcard.png" width="1080" height="1350" alt="GPT-5.6 Terra: A Playbook social card uses a receipt layout to explain a 95 percent slot return to player. It shows 100 dollars wagered over time, approximately 95 dollars paid back, and approximately 5 dollars as the house edge."></div></section>
