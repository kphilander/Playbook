<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The small spin can move fast - {{PROGRAM_SHORT_NAME}}</title>
  <!--
  content_type: quick-reference
  pillar: [open, tools]
  tier: 1
  tone: confident-informative
  audience: [general]
  channel: [social-media]
  reading_level: grade-6-8
  Source: how-to-play/slots.md, "Tips for informed play".
  Visible arithmetic: $0.50 per spin, one spin every 3 seconds equals 20 spins per minute and $600 wagered per hour.
  -->
  <link rel="stylesheet" href="../../brand-inject.css">
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <article class="social-card wildcard-card" aria-labelledby="headline">
    <header class="card-header">
      <span class="card-logo">{{PROGRAM_SHORT_NAME}}</span>
      <span class="series-label">Budget math</span>
    </header>
    <main class="card-main">
      <h1 id="headline">The small spin can <em>move fast.</em></h1>
      <figure class="wildcard-visual" aria-label="A pace meter and equation showing fifty cents times twenty spins per minute times sixty minutes equals six hundred dollars wagered per hour">
        <div class="meter" aria-hidden="true">
          <span class="meter-title">$0.50 every 3 seconds</span>
          <div class="meter-stack">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <div class="equation">
          <div class="equation-row"><span>$0.50</span><span>x</span><span>20/min</span></div>
          <div class="equation-row"><span>x</span><span>60 min</span></div>
          <div class="equation-row final"><span>=</span><span>$600/hr</span></div>
          <small>Total wagered, not money lost.</small>
        </div>
      </figure>
      <p class="action-line">Set your budget before the reels get chatty.
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10h32v28H8z"/><path d="M16 19h16"/><path d="M16 29h10"/></svg>
      </p>
    </main>
    <footer class="card-footer" data-protected-zone="support-and-legal">
      <span>Free support: {{HELPLINE_NUMBER}}</span>
      <span class="footer-legal">{{AGE_DISCLAIMER}}</span>
    </footer>
  </article>
</body>
</html>
