<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; background: transparent; }
  .social-card {
    width: 1080px; height: 1080px;
    background: var(--pb-color-primary);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .social-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: var(--pb-gradient-bar, linear-gradient(90deg, var(--pb-color-accent), var(--pb-color-secondary))); }
  .card-header { padding: 56px 64px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .card-logo { font-family: var(--pb-font-heading); font-size: calc(32px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); font-weight: 700; letter-spacing: -0.018em; }
  .card-pillar { font-family: var(--pb-font-heading); font-size: calc(18px * var(--pb-template-text-scale, 1)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--pb-brand-ink, var(--pb-color-primary)); background: var(--pb-color-secondary); padding: 8px 22px; border-radius: 100px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }

  .card-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 64px; position: relative; z-index: 1; }
  .myth-label { font-family: var(--pb-font-heading); font-size: calc(16px * var(--pb-template-text-scale, 1)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--pb-color-accent); margin-bottom: 20px; }
  .myth-statement { font-family: var(--pb-font-heading); font-size: calc(48px * var(--pb-template-text-scale, 1)); font-weight: 800; line-height: 1.15; color: var(--pb-surface-ink, var(--pb-color-white)); margin-bottom: 32px; letter-spacing: -0.02em; }
  .fact-statement { font-family: var(--pb-font-body); font-size: calc(28px * var(--pb-template-text-scale, 1)); line-height: 1.55; color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); margin-bottom: 32px; }
  .fact-statement strong { color: var(--pb-color-secondary); font-weight: 600; }
  .share-prompt { font-family: var(--pb-font-heading); font-size: calc(20px * var(--pb-template-text-scale, 1)); font-weight: 600; color: var(--pb-surface-ink, var(--pb-color-white)); margin-top: 8px; }
  .share-prompt span { color: var(--pb-color-accent); }
  .stat-row { display: flex; gap: 16px; margin-top: 32px; }
  .stat-card { flex: 1; background: color-mix(in srgb, var(--pb-surface-ink, #fff) 4%, transparent); border: 1px solid color-mix(in srgb, var(--pb-surface-ink, #fff) 8%, transparent); border-radius: 12px; padding: 20px; text-align: center; }
  .stat-card .game { font-family: var(--pb-font-body); font-size: calc(16px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); margin-bottom: 8px; }
  .stat-card .edge { font-family: var(--pb-font-heading); font-size: calc(32px * var(--pb-template-text-scale, 1)); font-weight: 800; letter-spacing: -0.02em; }
  .stat-card .edge.teal { color: var(--pb-color-secondary); }
  .stat-card .edge.orange { color: var(--pb-color-accent); }
  .card-footer { background: var(--pb-color-primary-light); padding: 20px 64px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .footer-helpline { font-family: var(--pb-font-mono); font-weight: 700; font-size: calc(16px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); }
  .footer-legal { font-size: calc(13px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); font-family: var(--pb-font-body); }
</style>
  <link rel="stylesheet" href="brand-inject.css">
  <link rel="stylesheet" href="creative-system.css">
</head>
<body>
<div class="social-card pb-creative" data-layout="single-proof">
  <div class="card-header">
    <span class="card-logo">{{PROGRAM_SHORT_NAME}}</span>
    
  </div>
  <div class="card-body">
    <div class="myth-label">Myth vs. Math</div>
    <div class="myth-statement">Lucky seat.<br>Same game rules.</div>
    <div class="fact-statement">A random number generator decides the result. <strong>Your seat doesn’t change the game’s math.</strong> Check the rules and paytable.</div>
    <div class="stat-row">
      <div class="stat-card">
        <div class="game">Seat-based advantage</div>
        <div class="edge teal">0%</div>
      </div>
    </div>
  </div>
  <div class="card-footer" data-protected-zone="support-and-legal">
    <span class="footer-helpline">Free support 24/7: {{HELPLINE_NUMBER}}</span>
    <span class="footer-legal">{{AGE_DISCLAIMER}}</span>
  </div>
</div>
</body>
</html>
