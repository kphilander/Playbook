<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Poster 19d — Game IQ quiz. Photography poster series (19).
     Photo: AI-generated (Gemini `gemini-3-pro-image`), art-directed per
     visual-identity/photography/photography.md (cinematic warm key light,
     navy-tinted shadows, lower-third negative space for text overlay).
     Prompt source: collateral/render/photos/PROMPTS.md -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: var(--pb-color-primary); }
  .poster {
    width: 1800px; height: 2400px;
    background: var(--pb-color-primary);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .poster::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 12px; background: var(--pb-gradient-bar, linear-gradient(90deg, var(--pb-color-accent), var(--pb-color-secondary))); z-index: 4; }
  .poster-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; z-index: 0; }
  /* Text-over-image scrim per visual-identity/photography/photography.md:
     top scrim clears the header; bottom gradient guarantees AA contrast at text position. */
  .photo-scrim { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg,
    color-mix(in srgb, var(--pb-color-primary-dark) 78%, transparent) 0%,
    color-mix(in srgb, var(--pb-color-primary-dark) 30%, transparent) 11%,
    transparent 23%,
    transparent 42%,
    color-mix(in srgb, var(--pb-color-primary) 55%, transparent) 58%,
    color-mix(in srgb, var(--pb-color-primary) 86%, transparent) 72%,
    color-mix(in srgb, var(--pb-color-primary-dark) 97%, transparent) 100%); }
  .poster-header { padding: 72px 96px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2; }
  .poster-logo { font-family: var(--pb-font-heading); font-size: calc(48px * var(--pb-template-text-scale, 1)); text-shadow: 0 1px 3px rgba(0,0,0,0.3); color: var(--pb-color-white); font-weight: 700; letter-spacing: -0.018em; }
  .poster-pillar { font-family: var(--pb-font-heading); font-size: calc(22px * var(--pb-template-text-scale, 1)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--pb-color-primary); background: var(--pb-color-secondary); padding: 12px 28px; border-radius: 100px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
  .poster-body { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 96px 64px; position: relative; z-index: 2; }
  .eyebrow { font-family: var(--pb-font-heading); font-size: calc(24px * var(--pb-template-text-scale, 1)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--pb-color-secondary); margin-bottom: 32px; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }
  .headline { font-family: var(--pb-font-heading); font-size: calc(104px * var(--pb-template-text-scale, 1)); font-weight: 900; line-height: 1.06; color: var(--pb-color-white); margin-bottom: 36px; letter-spacing: -0.03em; text-shadow: 0 1px 3px rgba(0,0,0,0.3); text-wrap: balance; }
  .subhead { font-family: var(--pb-font-body); font-size: calc(40px * var(--pb-template-text-scale, 1)); font-weight: 400; line-height: 1.45; color: var(--pb-color-neutral-100); margin-bottom: 64px; max-width: 1380px; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }
  .subhead strong { color: var(--pb-color-secondary); font-weight: 600; }
  .cta-row { display: flex; align-items: center; gap: 40px; }
  .poster-cta { display: inline-flex; align-items: center; padding: 32px 64px; background: var(--pb-color-secondary); color: var(--pb-color-primary); font-family: var(--pb-font-heading); font-weight: 700; font-size: calc(34px * var(--pb-template-text-scale, 1)); border-radius: 100px; text-decoration: none; letter-spacing: 0.02em; line-height: 1; }
  .cta-url { font-family: var(--pb-font-mono); font-weight: 600; font-size: calc(30px * var(--pb-template-text-scale, 1)); color: var(--pb-color-white); text-shadow: 0 1px 3px rgba(0,0,0,0.3); }
  .poster-footer { background: var(--pb-color-primary-light); padding: 48px 96px; display: flex; align-items: center; justify-content: space-between; gap: 32px; position: relative; z-index: 2; }
  .footer-helpline { font-family: var(--pb-font-mono); font-weight: 700; font-size: calc(40px * var(--pb-template-text-scale, 1)); color: var(--pb-color-white); }
  .footer-legal { font-family: var(--pb-font-body); font-size: calc(24px * var(--pb-template-text-scale, 1)); color: var(--pb-color-neutral-300); white-space: nowrap; }
  .headline em { font-style: italic; color: var(--pb-color-secondary); }
</style>
  <link rel="stylesheet" href="brand-inject.css">
  <link rel="stylesheet" href="creative-system.css">
</head>
<body>
<div class="poster pb-creative">
  <img class="poster-photo" src="photos/poster-19d.jpg" alt="Friends around a kitchen table laughing during a quiz on game night">
  <div class="photo-scrim"></div>
  <div class="poster-header">
    <span class="poster-logo">{{PROGRAM_SHORT_NAME}}</span>
    <span class="poster-pillar">Worth sharing</span>
  </div>
  <div class="poster-body">
    <div class="eyebrow">Worth comparing</div>
    <div class="headline">Settle the odds<br>debate.</div>
    <div class="subhead">Take the Game IQ quiz. Compare answers with a friend, then read the explanations.</div>
    <div class="cta-row">
      <a href="#" class="poster-cta">Test your game IQ</a>
      <span class="cta-url">{{PROGRAM_URL}}</span>
    </div>
  </div>
  <div class="poster-footer" data-protected-zone="support-and-legal">
    <span class="footer-helpline">Free, confidential support 24/7: {{HELPLINE_NUMBER}}</span>
    <span class="footer-legal">{{AGE_DISCLAIMER}}</span>
  </div>
</div>
</body>
</html>
