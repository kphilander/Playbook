<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>More picks. Smaller target. — {{PROGRAM_SHORT_NAME}}</title>
  <!--
  content_type: quick-reference
  pillar: [open, social]
  tier: 1
  tone: confident-informative
  audience: [sports-bettors, general]
  channel: [social-media]
  reading_level: grade-6-8
  Source: how-to-play/sports-betting.md, "Parlays".
  Hypothetical independent binary picks with true win probability 0.5 each:
  0.5 ** 4 = 0.0625 = 6.25% = 1/16. Not inferred from quoted sportsbook odds.
  -->
  <link rel="stylesheet" href="brand-inject.css">
  <link rel="stylesheet" href="concept-20.css">
</head>
<body>
  <article class="social-card concept-20 concept-parlay" data-layout="equal-outcomes" aria-labelledby="headline">
    <header class="card-header">
      <span class="card-logo">{{PROGRAM_SHORT_NAME}}</span>
      <span class="series-label">Parlay, unpacked</span>
    </header>
    <main class="concept-main">
      <h1 id="headline">More picks.<br><em>Smaller target.</em></h1>
      <p class="concept-copy">Four picks in one bet.<br>You need all four to win.</p>
      <figure class="probability-panel">
        <div class="outcome-grid" aria-hidden="true">
          <span class="all-win"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="5"><path d="m11 24 9 9 18-20"/></svg></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <figcaption class="probability-caption"><strong class="probability-number">1 in 16</strong>chance all four win<span class="percent">That’s 6.25%.</span></figcaption>
      </figure>
      <p class="concept-assumption">Example: four independent picks,<br>each with a true 50/50 chance.</p>
      <p class="concept-action">Know what you’re combining.
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M8 24h30M25 11l13 13-13 13"/></svg>
      </p>
    </main>
    <footer class="card-footer" data-protected-zone="support-and-legal">
      <span>Free support: {{HELPLINE_NUMBER}}</span>
      <span class="footer-legal">{{AGE_DISCLAIMER}}</span>
    </footer>
  </article>
</body>
</html>
