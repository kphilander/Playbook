<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; background: transparent; }
  .social-card {
    width: 1080px; height: 1080px;
    background-image: linear-gradient(var(--pb-texture-line, color-mix(in srgb, var(--pb-surface-ink, #fff) 2%, transparent)) 1px, transparent 1px), linear-gradient(90deg, var(--pb-texture-line, color-mix(in srgb, var(--pb-surface-ink, #fff) 2%, transparent)) 1px, transparent 1px), var(--pb-gradient-bg, linear-gradient(145deg, var(--pb-color-primary-dark), var(--pb-color-primary)));
    background-size: 48px 48px, 48px 48px, cover;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .social-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: var(--pb-gradient-bar, linear-gradient(90deg, var(--pb-color-accent), var(--pb-color-secondary))); }
  .card-header { padding: 56px 64px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .card-logo { font-family: var(--pb-font-heading); font-size: calc(32px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); font-weight: 700; letter-spacing: -0.018em; }
  .section-label { font-family: var(--pb-font-heading); font-size: calc(16px * var(--pb-template-text-scale, 1)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--pb-color-accent); }
  /* Fixed top offset matching the 16-series myth cards */
  .card-body { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; padding: 205px 64px 0; position: relative; z-index: 1; }
  .headline { font-family: var(--pb-font-heading); font-size: calc(48px * var(--pb-template-text-scale, 1)); font-weight: 800; line-height: 1.15; color: var(--pb-surface-ink, var(--pb-color-white)); margin-bottom: 32px; letter-spacing: -0.02em; }
  .fact-statement { font-family: var(--pb-font-body); font-size: calc(26px * var(--pb-template-text-scale, 1)); line-height: 1.55; color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); }
  .fact-statement strong { color: var(--pb-color-accent); font-weight: 600; }
  .bar-viz { margin-top: 96px; }
  .bar-row { display: flex; align-items: center; gap: 16px; }
  .bar-track { width: 720px; height: 52px; flex-shrink: 0; border-radius: 4px; background: var(--pb-surface-track, color-mix(in srgb, var(--pb-surface-ink, #fff) 5%, transparent)); border: 1px solid var(--pb-surface-track-border, color-mix(in srgb, var(--pb-surface-ink, #fff) 8%, transparent)); overflow: hidden; }
  .bar { height: 100%; background: var(--pb-color-accent); border-radius: 0 4px 4px 0; }
  .bar.single { width: 50%; }
  .bar.parlay { width: 6.25%; }
  .bar-value { font-family: var(--pb-font-heading); font-weight: 700; font-size: calc(30px * var(--pb-template-text-scale, 1)); line-height: 1; color: var(--pb-color-accent); }
  .bar-caption { font-family: var(--pb-font-body); font-size: calc(17px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); margin: 10px 0 44px; }
  .bar-caption:last-child { margin-bottom: 0; }
  .card-footer { background: var(--pb-color-primary-light); padding: 20px 64px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .footer-helpline { font-family: var(--pb-font-mono); font-weight: 700; font-size: calc(16px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); }
  .footer-legal { font-size: calc(13px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); font-family: var(--pb-font-body); }
</style>
  <link rel="stylesheet" href="brand-inject.css">
  <link rel="stylesheet" href="creative-system.css">
</head>
<body>
<div class="social-card pb-creative">
  <div class="card-header">
    <span class="card-logo">{{PROGRAM_SHORT_NAME}}</span>
    <span class="section-label">The Big Game</span>
  </div>
  <div class="card-body">
    <div class="headline">One pick. Four picks.<br>Different chances.</div>
    <div class="fact-statement">Example: each pick has a true 50/50 chance, and the picks are <strong>independent.</strong></div>
    <div class="bar-viz">
      <div class="bar-row"><div class="bar-track"><div class="bar single"></div></div><span class="bar-value">50%</span></div>
      <div class="bar-caption">one pick wins</div>
      <div class="bar-row"><div class="bar-track"><div class="bar parlay"></div></div><span class="bar-value">6.25%</span></div>
      <div class="bar-caption">all four picks win</div>
    </div>
  </div>
  <div class="card-footer" data-protected-zone="support-and-legal">
    <span class="footer-helpline">Free support 24/7: {{HELPLINE_NUMBER}}</span>
    <span class="footer-legal">{{AGE_DISCLAIMER}}</span>
  </div>
</div>
</body>
</html>
