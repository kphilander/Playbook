<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Half right. Still down. — {{PROGRAM_SHORT_NAME}}</title>
  <!--
  content_type: quick-reference
  pillar: [open]
  tier: 1
  tone: confident-informative
  audience: [sports-bettors]
  channel: [social-media]
  reading_level: grade-6-8
  Source: how-to-play/sports-betting.md, "Break-even win rates".
  Arithmetic assumes ten equal $110 bets at -110: five wins return $500 profit; five losses cost $550; net -$50.
  -->
  <link rel="stylesheet" href="../../render/brand-inject.css">
  <link rel="stylesheet" href="../../render/model-comparison/fonts.css">
  <link rel="stylesheet" href="../../render/model-comparison/sol/style.css">
<link rel="stylesheet" href="../pilot-refinements.css"></head>
<body>
  <article class="social-card sol-card sports-card" aria-labelledby="sports-title">
    <header class="card-header">
      <span class="card-logo">{{PROGRAM_SHORT_NAME}}</span>
      <span class="series-label">Sports math</span>
    </header>
    <main class="card-main">
      <h1 id="sports-title">Half right.<br><em>Still down.</em></h1>
      <p class="lead">At −110, a 50% record does not break even.</p>
      <figure class="scoreboard" aria-label="Ten equal bets at minus 110: five wins earn 500 dollars in profit, five losses cost 550 dollars, for a net loss of 50 dollars.">
        <figcaption class="scoreboard-caption">10 equal bets · risk $110 to win $100</figcaption>
        <div class="score-grid">
          <div class="score-cell">
            <span class="score-label">5 wins</span>
            <strong class="score-amount">+$500</strong>
          </div>
          <div class="score-cell">
            <span class="score-label">5 losses</span>
            <strong class="score-amount">−$550</strong>
          </div>
        </div>
        <div class="net-line"><span>Example net result</span><strong>−$50</strong></div>
      </figure>
      <p class="action-line">Check the price, then the return.</p>
    </main>
    <footer class="card-footer" data-protected-zone="support-and-legal">
      <span class="footer-support">Free support: {{HELPLINE_NUMBER}}</span>
      <span class="footer-legal">{{AGE_DISCLAIMER}}</span>
    </footer>
  </article>
</body>
</html>
