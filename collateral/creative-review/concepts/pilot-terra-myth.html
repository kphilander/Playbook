<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../render/brand-inject.css">
  <link rel="stylesheet" href="../../render/model-comparison/fonts.css">
  <link rel="stylesheet" href="../../render/layout-system.css">
  <link rel="stylesheet" href="../../render/model-comparison/terra/style.css">
  <title>Losses don’t load a spin</title>
<link rel="stylesheet" href="../pilot-refinements.css"></head>
<body>
<!-- taxonomy: content_type=myth-bust; pillar=open; tier=1; tone=playful-witty; audience=general; channel=social-media; reading_level=grade-6-8 -->
<main class="social-card myth-card" aria-labelledby="myth-title">
  <header class="card-header">
    <div class="card-logo">{{PROGRAM_SHORT_NAME}}</div><div class="tag">MYTH</div>
  </header>
  <section class="card-body">
    <p class="eyebrow">“It has to be due.”</p>
    <h1 class="headline" id="myth-title">Losses don’t load a spin.</h1>
    <p class="deck">Past losses don’t make an independent spin due.</p>
    <div class="memory-machine" role="img" aria-label="A row of seven faded past spin markers is separated from a bright next spin result, showing that earlier spins do not change the next result.">
      <div class="past" aria-hidden="true"><span>×</span><span>×</span><span>×</span><span>×</span><span>×</span><span>×</span><span>×</span></div>
      <div class="divider" aria-hidden="true"></div>
      <div class="spin-result"><div class="spin-copy">NEXT SPIN<strong>SAME ODDS</strong></div><div class="rng-mark" aria-hidden="true"></div></div>
    </div>
    <p class="action myth-action">Check your plan before the next spin.</p>
  </section>
  <footer class="card-footer" data-protected-zone="support-and-legal">
    <span class="footer-copy">Free, confidential support: {{HELPLINE_NUMBER}}</span>
    <span class="footer-copy">{{AGE_DISCLAIMER}}</span>
  </footer>
</main>
</body>
</html>
