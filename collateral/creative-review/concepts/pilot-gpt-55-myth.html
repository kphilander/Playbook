          <span class="stake-result">$5 expected loss over time</span>
        </div>
      </figure>
      <p class="deck">Same game settings, same paytable: bet size scales dollars, not the edge.</p>
      <p class="action-line"><span class="equals-tag">5% example</span> Pick your bet for budget, not better odds.</p>
