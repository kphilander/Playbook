<!DOCTYPE html>
<html lang="en">
<head><base href="../../render/">
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; background: transparent; }
  .story-card {
    width: 1080px; height: 1920px;
    background: var(--pb-gradient-bg, linear-gradient(180deg, var(--pb-color-primary), var(--pb-color-primary-dark)));
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .story-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: var(--pb-gradient-bar, linear-gradient(90deg, var(--pb-color-accent), var(--pb-color-secondary))); z-index: 2; }
  .story-header { padding: 48px 48px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .story-logo { font-family: var(--pb-font-heading); font-size: calc(28px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); font-weight: 700; letter-spacing: -0.018em; }
  .story-pillar { font-family: var(--pb-font-heading); font-size: calc(16px * var(--pb-template-text-scale, 1)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--pb-brand-ink, var(--pb-color-primary)); background: var(--pb-color-secondary); padding: 8px 20px; border-radius: 100px; }

  .story-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 48px; position: relative; z-index: 1; }
  .myth-label { font-family: var(--pb-font-heading); font-size: calc(16px * var(--pb-template-text-scale, 1)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--pb-color-accent); margin-bottom: 24px; }
  .myth-statement { font-family: var(--pb-font-heading); font-size: calc(48px * var(--pb-template-text-scale, 1)); font-weight: 800; line-height: 1.15; color: var(--pb-surface-ink, var(--pb-color-white)); margin-bottom: 32px; letter-spacing: -0.02em; }
  .myth-statement .strike { text-decoration: line-through; text-decoration-color: var(--pb-color-accent); text-decoration-thickness: 5px; color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); }
  .divider { width: 80px; height: 4px; background: var(--pb-gradient-bar, linear-gradient(90deg, var(--pb-color-accent), var(--pb-color-secondary))); margin-bottom: 32px; border-radius: 2px; }
  .fact-statement { font-family: var(--pb-font-body); font-size: calc(30px * var(--pb-template-text-scale, 1)); line-height: 1.55; color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); margin-bottom: 40px; }
  .fact-statement strong { color: var(--pb-color-secondary); font-weight: 600; }
  .stat-block { background: color-mix(in srgb, var(--pb-surface-ink, #fff) 4%, transparent); border: 1px solid color-mix(in srgb, var(--pb-surface-ink, #fff) 8%, transparent); border-radius: 20px; padding: 32px; text-align: center; margin-bottom: 40px; }
  .stat-number { font-family: var(--pb-font-heading); font-size: calc(72px * var(--pb-template-text-scale, 1)); font-weight: 900; color: var(--pb-color-accent); line-height: 1; letter-spacing: -0.03em; margin-bottom: 8px; }
  .stat-label { font-family: var(--pb-font-heading); font-size: calc(20px * var(--pb-template-text-scale, 1)); font-weight: 600; color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); }
  .story-cta { display: block; width: 100%; padding: 24px; background: var(--pb-color-secondary); color: var(--pb-brand-ink, var(--pb-color-primary)); font-family: var(--pb-font-heading); font-weight: 700; font-size: calc(22px * var(--pb-template-text-scale, 1)); text-align: center; border-radius: 16px; text-decoration: none; letter-spacing: 0.02em; }
  .story-footer { background: var(--pb-color-primary-light); padding: 24px 48px; text-align: center; position: relative; z-index: 1; }
  .footer-helpline { font-family: var(--pb-font-mono); font-weight: 700; font-size: calc(16px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); }
  .footer-legal { font-size: calc(13px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); font-family: var(--pb-font-body); }
</style>
  <link rel="stylesheet" href="brand-inject.css">
  <link rel="stylesheet" href="creative-system.css">
  <link rel="stylesheet" href="text-polish.css">
  <link rel="stylesheet" href="text-surfaces.css">
</head>
<body>
<div class="story-card pb-creative pb-text-polish" data-surface="spotlight">
  <div class="story-header">
    <span class="story-logo">Playbook</span>

  </div>
  <div class="story-body">
    <div class="myth-label">Monday Myth</div>
    <div class="myth-statement"><span class="strike">"I'm on a hot streak"</span></div>
    <div class="divider"></div>
    <div class="fact-statement">A run of wins can happen. In an independent slot game, <strong>past wins don’t improve the next spin.</strong></div>
    <div class="stat-block">
      <div class="stat-number">0%</div>
      <div class="stat-label">chance past results affect the next spin</div>
    </div>
    <a href="#" class="story-cta">See how it works</a>
  </div>
  <div class="story-footer" data-protected-zone="support-and-legal">
    <span class="footer-helpline">Free, confidential support 24/7: <span class="support-number">1-800-522-4700</span></span>
    <span class="footer-legal">You must be 21+ to gamble.</span>
  </div>
</div>
</body>
</html>
