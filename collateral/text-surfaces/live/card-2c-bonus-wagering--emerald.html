<!DOCTYPE html>
<html lang="en">
<head><base href="../../render/">
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; background: transparent; }
  .social-card {
    width: 1080px; height: 1080px;
    background: var(--pb-color-primary);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .social-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: var(--pb-gradient-bar, linear-gradient(90deg, var(--pb-color-accent), var(--pb-color-secondary))); }
  .card-header { padding: 56px 64px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .card-logo { font-family: var(--pb-font-heading); font-size: calc(32px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); font-weight: 700; letter-spacing: -0.018em; }
  .card-pillar { font-family: var(--pb-font-heading); font-size: calc(18px * var(--pb-template-text-scale, 1)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--pb-brand-ink, var(--pb-color-primary)); background: var(--pb-color-secondary); padding: 8px 22px; border-radius: 100px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }

  .card-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 64px; position: relative; z-index: 1; }
  .quiz-label { font-family: var(--pb-font-heading); font-size: calc(16px * var(--pb-template-text-scale, 1)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--pb-color-secondary); margin-bottom: 20px; }
  .headline { font-family: var(--pb-font-heading); font-size: calc(56px * var(--pb-template-text-scale, 1)); font-weight: 800; line-height: 1.15; color: var(--pb-surface-ink, var(--pb-color-white)); margin-bottom: 32px; letter-spacing: -0.02em; }
  .quiz-question { background: color-mix(in srgb, var(--pb-surface-ink, #fff) 4%, transparent); border: 1px solid color-mix(in srgb, var(--pb-surface-ink, #fff) 8%, transparent); border-radius: 16px; padding: 28px 32px; margin-bottom: 32px; }
  .quiz-question p { font-family: var(--pb-font-heading); font-weight: 600; font-size: calc(24px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); line-height: 1.4; font-style: italic; }
  .answer { font-family: var(--pb-font-body); font-size: calc(26px * var(--pb-template-text-scale, 1)); line-height: 1.55; color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); margin-bottom: 24px; }
  .answer strong { color: var(--pb-color-secondary); font-weight: 600; }
  .challenge { font-family: var(--pb-font-heading); font-size: calc(22px * var(--pb-template-text-scale, 1)); font-weight: 700; color: var(--pb-color-accent); }
  .card-footer { background: var(--pb-color-primary-light); padding: 20px 64px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .footer-helpline { font-family: var(--pb-font-mono); font-weight: 700; font-size: calc(16px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); }
  .footer-legal { font-size: calc(13px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); font-family: var(--pb-font-body); }
</style>
  <link rel="stylesheet" href="brand-inject.css">
  <link rel="stylesheet" href="creative-system.css">
  <link rel="stylesheet" href="text-polish.css">
  <link rel="stylesheet" href="text-surfaces.css">
</head>
<body>
<div class="social-card pb-creative pb-text-polish" data-surface="emerald">
  <div class="card-header">
    <span class="card-logo">Playbook</span>

  </div>
  <div class="card-body">
    <div class="quiz-label">Game IQ Quiz</div>
    <div class="headline">Think you know the odds?</div>
    <div class="quiz-question">
      <p>"A slot machine hasn't paid out in 3 hours. What are the odds on the next spin?"</p>
    </div>
    <div class="answer">For independent spins, the same odds. Past losses don’t make a win due.</div>
  </div>
  <div class="card-footer" data-protected-zone="support-and-legal">
    <span class="footer-helpline">Free support 24/7: <span class="support-number">1-800-522-4700</span></span>
    <span class="footer-legal">You must be 21+ to gamble.</span>
  </div>
</div>
</body>
</html>
