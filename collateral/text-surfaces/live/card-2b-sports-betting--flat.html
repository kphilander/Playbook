<!DOCTYPE html>
<html lang="en">
<head><base href="../../render/">
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; background: transparent; }
  .social-card {
    width: 1080px; height: 1080px;
    background: var(--pb-color-primary);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .social-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: var(--pb-gradient-bar, linear-gradient(90deg, var(--pb-color-accent), var(--pb-color-secondary))); }
  .card-header { padding: 56px 64px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .card-logo { font-family: var(--pb-font-heading); font-size: calc(32px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); font-weight: 700; letter-spacing: -0.018em; }

  .section-label { font-family: var(--pb-font-heading); font-size: calc(16px * var(--pb-template-text-scale, 1)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--pb-color-accent); }
  .card-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 64px; position: relative; z-index: 1; }
  .headline { font-family: var(--pb-font-heading); font-size: calc(52px * var(--pb-template-text-scale, 1)); font-weight: 800; line-height: 1.15; color: var(--pb-surface-ink, var(--pb-color-white)); margin-bottom: 40px; letter-spacing: -0.02em; }
  .breakdown { margin-bottom: 36px; }
  .breakdown-line { font-family: var(--pb-font-mono); font-size: calc(28px * var(--pb-template-text-scale, 1)); font-weight: 600; color: var(--pb-surface-ink, var(--pb-color-white)); line-height: 2; }
  .breakdown-line .amount { color: var(--pb-color-secondary); font-weight: 700; }
  .breakdown-line .cut { color: var(--pb-color-accent); font-weight: 700; }
  .explanation { font-family: var(--pb-font-body); font-size: calc(26px * var(--pb-template-text-scale, 1)); line-height: 1.55; color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); margin-bottom: 32px; }
  .emphasis { font-family: var(--pb-font-heading); font-size: calc(22px * var(--pb-template-text-scale, 1)); font-weight: 700; color: var(--pb-color-accent); letter-spacing: 0.02em; }
  .vig-strip { margin-top: 32px; display: flex; gap: 16px; }
  .vig-card { flex: 1; background: color-mix(in srgb, var(--pb-surface-ink, #fff) 4%, transparent); border: 1px solid color-mix(in srgb, var(--pb-surface-ink, #fff) 8%, transparent); border-radius: 12px; padding: 20px; text-align: center; }
  .vig-label { font-family: var(--pb-font-body); font-size: calc(16px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); margin-bottom: 8px; }
  .vig-value { font-family: var(--pb-font-heading); font-size: calc(28px * var(--pb-template-text-scale, 1)); font-weight: 800; color: var(--pb-surface-ink, var(--pb-color-white)); }
  .vig-note { font-family: var(--pb-font-body); font-size: calc(14px * var(--pb-template-text-scale, 1)); color: var(--pb-color-neutral-500); margin-top: 4px; }
  .card-footer { background: var(--pb-color-primary-light); padding: 20px 64px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .footer-helpline { font-family: var(--pb-font-mono); font-weight: 700; font-size: calc(16px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); }
  .footer-legal { font-size: calc(13px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); font-family: var(--pb-font-body); }
</style>
  <link rel="stylesheet" href="brand-inject.css">
  <link rel="stylesheet" href="creative-system.css">
  <link rel="stylesheet" href="text-polish.css">
  <link rel="stylesheet" href="text-surfaces.css">
</head>
<body>
<div class="social-card pb-creative pb-text-polish" data-surface="flat">
  <div class="card-header">
    <span class="card-logo">Playbook</span>
    <span class="section-label">Real Odds</span>
  </div>
  <div class="card-body">
    <div class="headline">−110.<br>Read the whole return.</div>
    <div class="breakdown">
      <div class="breakdown-line">Risk <span class="amount">$110</span></div>
      <div class="breakdown-line">Profit if you win <span class="amount">$100</span></div>
    </div>
    <div class="explanation">A winning $110 cash bet returns $210.</div>
    <div class="emphasis">Your stake plus your profit.</div>
  </div>
  <div class="card-footer" data-protected-zone="support-and-legal">
    <span class="footer-helpline">Free support 24/7: <span class="support-number">1-800-522-4700</span></span>
    <span class="footer-legal">You must be 21+ to gamble.</span>
  </div>
</div>
</body>
</html>
