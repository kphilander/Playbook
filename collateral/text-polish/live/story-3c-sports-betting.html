<!DOCTYPE html>
<html lang="en">
<head><base href="../../render/">
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; background: transparent; }
  .story-card {
    width: 1080px; height: 1920px;
    background: var(--pb-gradient-bg, linear-gradient(180deg, var(--pb-color-primary), var(--pb-color-primary-dark)));
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .story-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: var(--pb-gradient-bar, linear-gradient(90deg, var(--pb-color-accent), var(--pb-color-secondary))); z-index: 2; }
  .story-header { padding: 48px 48px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .story-logo { font-family: var(--pb-font-heading); font-size: calc(28px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); font-weight: 700; letter-spacing: -0.018em; }
  .story-pillar { font-family: var(--pb-font-heading); font-size: calc(16px * var(--pb-template-text-scale, 1)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--pb-brand-ink, var(--pb-color-primary)); background: var(--pb-color-secondary); padding: 8px 20px; border-radius: 100px; }

  .story-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 48px; position: relative; z-index: 1; }
  .eyebrow { font-family: var(--pb-font-heading); font-size: calc(16px * var(--pb-template-text-scale, 1)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--pb-color-secondary); margin-bottom: 20px; }
  .headline { font-family: var(--pb-font-heading); font-size: calc(48px * var(--pb-template-text-scale, 1)); font-weight: 800; line-height: 1.15; color: var(--pb-surface-ink, var(--pb-color-white)); margin-bottom: 40px; letter-spacing: -0.02em; }
  .quiz-box { background: color-mix(in srgb, var(--pb-surface-ink, #fff) 4%, transparent); border: 1px solid color-mix(in srgb, var(--pb-surface-ink, #fff) 8%, transparent); border-radius: 20px; padding: 36px; margin-bottom: 40px; text-align: center; }
  .quiz-box .question { font-family: var(--pb-font-heading); font-weight: 600; font-size: calc(26px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); line-height: 1.4; font-style: italic; margin-bottom: 24px; }
  .quiz-box .answer-label { font-family: var(--pb-font-heading); font-size: calc(14px * var(--pb-template-text-scale, 1)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--pb-color-accent); margin-bottom: 12px; }
  .quiz-box .answer { font-family: var(--pb-font-body); font-size: calc(22px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); line-height: 1.5; }
  .quiz-box .answer strong { color: var(--pb-color-secondary); font-weight: 600; }
  .breakdown-visual { display: flex; gap: 16px; margin-bottom: 40px; }
  .money-block { flex: 1; background: color-mix(in srgb, var(--pb-surface-ink, #fff) 4%, transparent); border: 1px solid color-mix(in srgb, var(--pb-surface-ink, #fff) 8%, transparent); border-radius: 16px; padding: 24px; text-align: center; }
  .money-label { font-family: var(--pb-font-body); font-size: calc(18px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); margin-bottom: 8px; }
  .money-value { font-family: var(--pb-font-mono); font-size: calc(40px * var(--pb-template-text-scale, 1)); font-weight: 700; }
  .money-value.green { color: var(--pb-color-secondary); }
  .money-value.white { color: var(--pb-surface-ink, var(--pb-color-white)); }
  .money-value.orange { color: var(--pb-color-accent); }
  .money-note { font-family: var(--pb-font-body); font-size: calc(14px * var(--pb-template-text-scale, 1)); color: var(--pb-color-neutral-500); margin-top: 6px; }
  .story-cta { display: block; width: 100%; padding: 24px; background: var(--pb-color-secondary); color: var(--pb-brand-ink, var(--pb-color-primary)); font-family: var(--pb-font-heading); font-weight: 700; font-size: calc(22px * var(--pb-template-text-scale, 1)); text-align: center; border-radius: 16px; text-decoration: none; }
  .story-footer { background: var(--pb-color-primary-light); padding: 24px 48px; text-align: center; position: relative; z-index: 1; }
  .footer-helpline { font-family: var(--pb-font-mono); font-weight: 700; font-size: calc(16px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink, var(--pb-color-white)); }
  .footer-legal { font-size: calc(13px * var(--pb-template-text-scale, 1)); color: var(--pb-surface-ink-muted, var(--pb-color-neutral-300)); font-family: var(--pb-font-body); }
</style>
  <link rel="stylesheet" href="brand-inject.css">
  <link rel="stylesheet" href="creative-system.css">
  <link rel="stylesheet" href="text-polish.css">
</head>
<body>
<div class="story-card pb-creative pb-text-polish" data-layout="visual-answer">
  <div class="story-header">
    <span class="story-logo">Playbook</span>

  </div>
  <div class="story-body">
    <div class="eyebrow">Friday Quiz</div>
    <div class="headline">What does -110 mean in sports betting?</div>
    <div class="breakdown-visual">
      <div class="money-block">
        <div class="money-label">You bet</div>
        <div class="money-value green">$110</div>
      </div>
      <div class="money-block">
        <div class="money-label">Profit if you win</div>
        <div class="money-value white">$100</div>
      </div>
      <div class="money-block">
        <div class="money-label">Total return</div>
        <div class="money-value orange">$210</div>
        <div class="money-note">includes your stake</div>
      </div>
    </div>
    <a href="#" class="story-cta">Know the math behind every line</a>
  </div>
  <div class="story-footer" data-protected-zone="support-and-legal">
    <span class="footer-helpline">Free, confidential support 24/7: <span class="support-number">1-800-522-4700</span></span>
    <span class="footer-legal">You must be 21+ to gamble.</span>
  </div>
</div>
</body>
</html>
